<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Prompt Rewriter</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="head">
    <span class="head__icon">✨</span>
    <div>
      <h1>Prompt Rewriter</h1>
      <p class="head__sub">Tối ưu prompt trên mọi trang web</p>
    </div>
  </header>

  <main>
    <label class="field">
      <span class="field__label">Nhà cung cấp</span>
      <select id="provider"></select>
      <span class="field__hint">
        Mỗi nhà cung cấp lưu key và model riêng — đổi qua lại không mất cấu hình.
      </span>
    </label>

    <label class="field" id="baseUrlField" hidden>
      <span class="field__label">Base URL</span>
      <input id="baseUrl" type="text" spellcheck="false" placeholder="https://api.groq.com/openai/v1" />
      <span class="field__hint">
        Endpoint tương thích OpenAI. Thường kết thúc bằng <code>/v1</code>.
        Dùng được với Groq, Together, DeepSeek, Mistral, Ollama, LM Studio, vLLM…
      </span>
    </label>

    <label class="field">
      <span class="field__label">API Key</span>
      <div class="field__row">
        <input id="apiKey" type="password" autocomplete="off" spellcheck="false" />
        <button id="toggleKey" class="btn-ghost" type="button" title="Hiện/ẩn key">👁</button>
      </div>
      <span class="field__hint">
        Lấy key tại <a id="keyLink" href="#" target="_blank" rel="noopener">trang quản lý key</a>.
        Key chỉ lưu trong <code>chrome.storage.local</code> trên máy bạn.
      </span>
    </label>

    <label class="field">
      <span class="field__label">Model</span>
      <input id="model" type="text" list="modelList" spellcheck="false" autocomplete="off" />
      <datalist id="modelList"></datalist>
      <span class="field__hint" id="modelHint"></span>
    </label>

    <label class="field">
      <span class="field__label">
        Độ sáng tạo <output id="tempOut">0.4</output>
      </span>
      <input id="temperature" type="range" min="0" max="1" step="0.1" value="0.4" />
      <span class="field__hint">
        Thấp = bám sát ý gốc. Một số model đời mới (Claude Opus/Sonnet 5, GPT reasoning)
        không nhận tham số này — tiện ích sẽ tự bỏ qua.
      </span>
    </label>

    <label class="field">
      <span class="field__label">Hướng dẫn bổ sung (tuỳ chọn)</span>
      <textarea id="extraInstruction" rows="3"
        placeholder="VD: Luôn viết prompt bằng tiếng Anh. Luôn thêm mục 'Ràng buộc'."></textarea>
    </label>

    <div class="field field--check">
      <input id="showButton" type="checkbox" />
      <label for="showButton">
        Hiện nút ✨ khi focus vào ô nhập liệu
        <span class="field__hint">Tắt đi thì chỉ dùng phím tắt và menu chuột phải — trang web sẽ hoàn toàn sạch.</span>
      </label>
    </div>

    <label class="field">
      <span class="field__label">Tắt trên các tên miền (mỗi dòng một tên)</span>
      <textarea id="blocklist" rows="3" spellcheck="false"
        placeholder="mail.google.com&#10;facebook.com&#10;docs.google.com"></textarea>
      <span class="field__hint">Áp dụng cho cả tên miền con. Có hiệu lực ngay, không cần tải lại trang.</span>
    </label>

    <div class="actions">
      <button id="save" class="btn-primary" type="button">Lưu cấu hình</button>
      <button id="test" class="btn-secondary" type="button">Kiểm tra kết nối</button>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>

  <footer class="foot">
    Dùng ở <b>mọi trang web</b> theo 3 cách:
    bấm nút <b>✨</b> hiện lên khi focus vào ô nhập &middot;
    phím tắt <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>U</kbd> &middot;
    chuột phải → <b>Viết lại</b>.
  </footer>

  <script src="popup.js"></script>
</body>
</html>
